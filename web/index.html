<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ghost — сайт музыкальной группы: дискография, состав, мерч и афиша.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ghost">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ghost — музыкальная группа</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #111111; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      font-family: Georgia, serif; text-align: center; color: #f4f1ea; }
    #loading h1 { font-size: 32px; letter-spacing: 0.18em; margin-bottom: 8px; }
    #loading p { max-width: 420px; line-height: 1.5; }
    .spinner { width: 36px; height: 36px; margin-top: 20px; border: 4px solid #333;
      border-top-color: #c6a15b; border-radius: 50%; animation: spin 1s linear infinite; }
    #loading button { margin-top: 16px; padding: 12px 20px; font-size: 16px; cursor: pointer;
      background: #c6a15b; color: #111; border: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <h1>GHOST</h1>
    <p>Сайт музыкальной группы</p>
    <div class="spinner" aria-label="Загрузка приложения"></div>
    <p id="loading-message">Загружаем дискографию…</p>
    <button id="loading-retry" hidden onclick="location.reload()">Повторить загрузку</button>
  </div>
  <noscript>Чтобы открыть сайт группы Ghost, включите JavaScript в браузере.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      window.ghostReadyMs = performance.now();
      document.documentElement.dataset.firstFrameMs = window.ghostReadyMs.toFixed(1);
      performance.mark('ghost-first-frame');
      document.getElementById('loading')?.remove();
    });
    window.ghostLoadError = () => {
      const message = document.getElementById('loading-message');
      if (!message) return;
      message.textContent = 'Загрузка не завершена. Проверьте соединение и повторите попытку.';
      document.getElementById('loading-retry').hidden = false;
    };
    setTimeout(window.ghostLoadError, 45000);
  </script>
  <script src="flutter_bootstrap.js" async onerror="window.ghostLoadError()"></script>
</body>
</html>
